name: Build C21 Rocket APK
on:
  push:
    branches: [c21-rocket-apk]
    paths: ['c21-rocket/**', '.github/workflows/c21-rocket-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: c21-rocket
        run: gradle assembleDebug
      - name: Rename APK
        run: cp c21-rocket/app/build/outputs/apk/debug/app-debug.apk C21-Rocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: C21-Rocket-APK
          path: C21-Rocket.apk
